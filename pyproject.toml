[project]
name = "accounts-serverless"
version = "1.0.0"
description = "Arquetipo showcase Pragma Python serverless (AWS Lambda) hexagonal"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.3.0",
    "pydantic[email]>=2.9.2",
    "boto3>=1.35.0",
]

[dependency-groups]
# Grupo dev gestionado por uv (uv sync instala tambien estos).
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "moto[dynamodb,sns,events]>=5.0.18",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "boto3-stubs[dynamodb,sns,events]>=1.35.0",
    "types-redis>=4.6.0",
]

[tool.uv]
# El AWS SDK (boto3) lo provee el runtime de Lambda; se declara como dependencia
# para el desarrollo/tests pero NO se empaqueta en el artefacto (ver README).
package = false

# ---- Layout: codigo en src/ (src-layout) ----
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90 --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/application/composition/*",
    "src/*/__init__.py",
]

[tool.coverage.report]
# Gate de cobertura 90% (equivalente al de los arquetipos Java/Node).
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR2004"]  # magic values en tests son aceptables

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_defs = true
# moto/redis sin stubs completos: no obligamos a tiparlos.
[[tool.mypy.overrides]]
module = ["moto.*", "redis.*"]
ignore_missing_imports = true
